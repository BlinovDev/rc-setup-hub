services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rc_setup_hub
      POSTGRES_USER: rc_setup_dev
      POSTGRES_PASSWORD: rc_setup_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc_setup_dev -d rc_setup_hub"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
