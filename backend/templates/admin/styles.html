{{define "styles"}}
<style>
:root{font-family:system-ui,sans-serif;color:#17233a;background:#f3f5f9;line-height:1.5;color-scheme:light}*{box-sizing:border-box}body{margin:0}header,main{max-width:1120px;margin:auto;padding:1.25rem}header{border-bottom:1px solid #cad3df}h1{font-size:1.5rem}h2{font-size:1.4rem}a{color:#174eab;text-underline-offset:3px}nav ul{display:flex;gap:1rem;flex-wrap:wrap;list-style:none;padding:0}main{overflow-x:auto}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;vertical-align:top;padding:.8rem;border-bottom:1px solid #d5dce6}th{background:#e5ebf3}form{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end;margin:.6rem 0}label{display:flex;flex-direction:column;gap:.25rem}input,select,button{font:inherit;padding:.55rem .7rem;border:1px solid #8d9bb0;border-radius:.35rem;max-width:100%}button{background:#174eab;color:white;cursor:pointer;min-height:44px}.danger{background:#9c2436}:focus-visible{outline:3px solid #cc7100;outline-offset:3px}.badge{display:inline-block;background:#e8edf5;border:1px solid #a7b5ca;border-radius:1rem;padding:.1rem .6rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:1rem;border:1px solid #d5dce6}.notes{white-space:pre-wrap}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}.gallery figure{margin:0}.gallery img{max-width:100%;border-radius:.4rem}.actions{display:flex;gap:1rem;flex-wrap:wrap}[role=alert]{color:#9c2436;font-weight:600}@media(max-width:600px){header,main{padding:1rem}th,td{padding:.5rem}nav ul{gap:.6rem}input{width:100%}form{align-items:stretch}td form{min-width:170px}}
</style>
{{end}}
