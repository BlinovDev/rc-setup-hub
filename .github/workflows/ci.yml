name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-skills:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify documentation links and routing
        run: python3 scripts/verify-docs.py
      - name: Test documentation validator
        run: python3 -m unittest discover -s scripts -p 'test_docs.py' -v
      - name: Verify engineering skill packaging and provenance
        run: python3 scripts/verify-engineering-skills.py
      - name: Test engineering skill validator
        run: python3 -m unittest discover -s scripts -p 'test_engineering_skills.py' -v
      - run: git diff --check

  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test host deployment safety helpers
        run: python3 -m unittest discover -s ../scripts/server -v
      - run: go version
      - run: go mod download
      - run: go mod verify
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Provision photo decoder
        run: sudo ../scripts/provision-photo-decoder.sh
      - run: go test ./...
      - run: go build ./...
      - name: Verify module files unchanged
        run: git diff --exit-code -- go.mod go.sum

  race:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: Provision photo decoder
        run: sudo ../scripts/provision-photo-decoder.sh
      - run: go test -race ./...

  photo-arm64:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Provision native ARM64 photo decoder
        run: sudo ../scripts/provision-photo-decoder.sh
      - run: go test ./internal/photos
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
